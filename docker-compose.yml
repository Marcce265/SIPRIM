services:
  postgres:
    image: postgres:16-alpine
    container_name: siprim-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - siprim_pgdata:/var/lib/postgresql/data
      - ./database:/opt/siprim/database:ro
      - ./database/bootstrap.sh:/docker-entrypoint-initdb.d/00-bootstrap.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d platform_db"]
      interval: 5s
      timeout: 5s
      retries: 15

  redis:
    image: redis:7-alpine
    container_name: siprim-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 15

  api:
    build: .
    container_name: siprim-api
    restart: unless-stopped
    environment:
      AUTH_DB_URL: postgresql+psycopg://auth_app:auth_dev_only@postgres:5432/auth_db
      PLATFORM_DB_URL: postgresql+psycopg://platform_app:platform_dev_only@postgres:5432/platform_db
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:-solo-desarrollo-cambiar-en-produccion}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-gemini-2.5-flash}
      AI_TIMEOUT_SECONDS: ${AI_TIMEOUT_SECONDS:-45}
    ports:
      - "${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 10
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  economic-worker:
    build: .
    container_name: siprim-economic-worker
    restart: unless-stopped
    command: celery -A backend.infrastructure.output.broker.tasks:celery_app worker -Q economic --loglevel=INFO
    environment:
      ECONOMIC_DB_URL: postgresql+psycopg://economic_app:economic_dev_only@postgres:5432/economic_db
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  platform-worker:
    build: .
    container_name: siprim-platform-worker
    restart: unless-stopped
    command: celery -A backend.infrastructure.output.broker.tasks:celery_app worker -Q platform --beat --loglevel=INFO
    environment:
      PLATFORM_DB_URL: postgresql+psycopg://platform_app:platform_dev_only@postgres:5432/platform_db
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  siprim_pgdata:
