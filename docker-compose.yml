services:
  db:
    image: postgres:16-alpine
    container_name: siprim-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: siprim
    ports:
      - "5432:5432"
    volumes:
      - siprim_pgdata:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d siprim"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  siprim_pgdata:
